<title>Name Mixer</title>
<style>
  :root {

    --a: #e0567a; --b: #3b82c4; --m: #8b5cf6; --t: #1f9d6b;

  }
  @media (prefers-color-scheme: dark) {

  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  body::before { content: "🎉 🎈 🎊 🥳 🎂 🎁 🪅 🎈 🎊 🎉 🎁 🥳"; position: fixed; inset: -10%; z-index: 0; pointer-events: none; font-size: 64px; line-height: 2.2; letter-spacing: 38px; word-break: break-all; opacity: .02; transform: rotate(-12deg); overflow: hidden; }
  body::after { content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none; background: radial-gradient(circle at 10% 15%, rgba(236,72,153,.015), transparent 40%), radial-gradient(circle at 90% 30%, rgba(59,130,246,.012), transparent 42%), radial-gradient(circle at 25% 85%, rgba(250,204,21,.015), transparent 40%), radial-gradient(circle at 85% 90%, rgba(139,92,246,.012), transparent 40%); }
  .wrap { position: relative; z-index: 1; min-height: 100vh; }
  .wrap > .panel:first-of-type { padding-top: 26px; padding-bottom: 30px; }
  .wrap > .panel:first-of-type .inputs input { padding-top: 14px; padding-bottom: 14px; font-size: 17px; }
  .wrap > .panel:first-of-type input[type=range] { margin: 10px 0 14px; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 28px 16px 70px; }
  .congrats { display: flex; align-items: center; gap: 12px; padding: 14px 16px; margin-bottom: 18px; border-radius: 16px; color: #fff; background: linear-gradient(120deg, #ec4899, #8b5cf6 55%, #3b82f6); box-shadow: 0 6px 18px rgba(139,92,246,.25); }

  .congrats > div > div { font-size: .85rem; opacity: .95; margin-top: 2px; }

  .inputs2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .exonly { display: none; }
  body.explore .exonly { display: block; }
  body.explore #namesRow { display: none; }
  body.explore .inputs2 { margin-top: 0; grid-template-columns: 1fr; }

  button { font: inherit; cursor: pointer; border-radius: 10px; border: 1px solid var(--border); background: var(--card); color: var(--text); padding: 9px 14px; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }

  .opwrap { display: flex; justify-content: center; margin: -4px 0; }

  .opchip[data-v=and] { background: var(--accent); color: #fff; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .seg button { border: none; border-radius: 0; background: var(--bg); padding: 9px 13px; }
  .seg button.active { background: var(--accent); color: #fff; font-weight: 600; }
  .chk { font-size: .88rem; color: var(--muted); display: flex; gap: 6px; align-items: center; }
  .spacer { flex: 1; }
  details.filters summary { cursor: pointer; font-weight: 600; list-style: none; }
  details.filters summary::-webkit-details-marker { display: none; }
  details.filters summary::before { content: "▸ "; color: var(--muted); }
  details.filters[open] summary::before { content: "▾ "; }
  .fgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-top: 14px; }
  .fgrid .wide { grid-column: 1 / -1; }
  .hint { font-size: .75rem; color: var(--muted); margin-top: 3px; }
  .legend { font-size: .82rem; color: var(--muted); margin-top: 10px; }
  .legend b.a { color: var(--a); } .legend b.b { color: var(--b); } .legend b.t { color: var(--t); } .legend b.m { color: var(--m); }
  h2 { font-size: 1.1rem; margin: 26px 0 10px; }
  h2 small { color: var(--muted); font-weight: 400; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(330px, 100%), 1fr)); gap: 10px; }
  .chip { background: color-mix(in srgb, var(--card) 38%, transparent); -webkit-backdrop-filter: blur(14px) saturate(1.4); backdrop-filter: blur(14px) saturate(1.4); box-shadow: 0 6px 20px rgba(80,60,140,.12), inset 0 1px 0 rgba(255,255,255,.45); border: 1px solid var(--border); border-radius: 14px; padding: 10px; text-align: left; position: relative; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.08fr); gap: 10px; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
  .chip .cl { min-width: 0; }
  .chip .nmrow { display: flex; align-items: flex-start; gap: 6px; }
  .chip .cr { min-width: 0; display: flex; flex-direction: column; gap: 4px; justify-content: center; }
  .thumb { border-radius: 8px; overflow: hidden; cursor: pointer; border: 1px solid var(--border); }
  .thumb svg { display: block; width: 100%; height: auto; }
  .pvcap { display: flex; justify-content: space-between; align-items: center; font-size: .7rem; color: var(--muted); gap: 6px; }
  .pvcap button { padding: 1px 8px; font-size: .85rem; border-radius: 6px; }
  .x { position: absolute; top: 5px; right: 5px; z-index: 2; width: 22px; height: 22px; padding: 0 !important; border-radius: 50%; line-height: 1; font-size: .7rem; background: rgba(15,15,25,.55) !important; color: #fff !important; border: none !important; }
  .dbar { font-size: .85rem; color: var(--muted); margin: 0 0 10px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .dbar button { padding: 4px 10px; font-size: .82rem; }
  .viewbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 4px 0 0; }
  .favonly { display: none; }
  body.favview .favonly { display: inline-block; }
  .tk b { color: var(--accent); }
  input[type=range] { width: 100%; accent-color: var(--accent); padding: 0; border: none; background: none; }
  .chip .nm { font-size: 1.3rem; font-weight: 700; letter-spacing: .3px; word-break: break-word; cursor: pointer; }
  .chip .pa { color: var(--a); } .chip .pb { color: var(--b); } .chip .pt { color: var(--t); } .chip .pm { color: var(--m); }
  .chip .full { font-size: .8rem; margin-top: 3px; }
  .chip .nick { font-size: .78rem; color: var(--muted); margin-top: 4px; }
  .chip .meta { font-size: .7rem; color: var(--muted); margin-top: 3px; }
  .chip .via { font-size: .74rem; color: var(--text); margin-top: 4px; line-height: 1.35; }
  .uq { font-size: .72rem; margin-top: 6px; display: flex; align-items: center; justify-content: flex-start; gap: 6px; }
  .uq .bar { width: 46px; height: 5px; border-radius: 3px; background: var(--border); overflow: hidden; display: inline-block; }
  .uq .bar i { display: block; height: 100%; background: var(--uc); }
  .uq b { color: var(--uc); font-weight: 600; }
  .u4 { --uc: #16a34a; } .u3 { --uc: #65a30d; } .u2 { --uc: #d97706; } .u1 { --uc: #dc2626; }
  .pv { margin-top: 8px; padding: 5px 10px; font-size: .78rem; border-radius: 8px; }
  .modal { position: fixed; inset: 0; background: rgba(10,8,14,.72); z-index: 10; overflow: auto; padding: 14px; }
  .modal[hidden] { display: none; }
  .mbox { max-width: 920px; margin: 0 auto; background: var(--bg); border: 1px solid var(--border); border-radius: 16px; padding: 16px; }
  .mhead { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .mname { font-size: 1.6rem; font-weight: 700; }
  .msub { color: var(--muted); font-size: .9rem; }
  .mhead select { width: auto; }
  .mgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 12px; margin-top: 14px; }
  .scene { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .scene svg { display: block; width: 100%; height: auto; }

  .star.on { color: #f5b301; }

  .shr:hover { color: var(--accent); }
  .shr svg { width: 17px; height: 17px; display: block; }
  .best { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(330px, 100%), 1fr)); gap: 12px; }
  .best .chip { border: 2px solid var(--accent); }
  .best .chip .nm { font-size: 1.45rem; }
  .browse { display: flex; flex-wrap: wrap; gap: 8px; }
  .browse button { padding: 7px 11px; font-size: .88rem; }
  .browse button small { color: var(--muted); }
  .empty { color: var(--muted); text-align: center; padding: 26px 0; }
  .note { font-size: .78rem; color: var(--muted); margin-top: 30px; text-align: center; }
  .toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 9px 16px; border-radius: 20px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 5; }
  .toast.show { opacity: 1; }
  @media (max-width: 640px) { .inputs, .inputs2 { grid-template-columns: 1fr; } .plus { margin: 0; justify-self: center; } }

  .panel, .chip { border: 1.5px solid color-mix(in srgb, var(--accent) 35%, var(--border)); }
  .seg { border: 1.5px solid color-mix(in srgb, var(--accent) 55%, var(--border)); }
  .seg button + button { border-left: 1.5px solid color-mix(in srgb, var(--accent) 55%, var(--border)); }
  .viewbar { border: 1.5px solid color-mix(in srgb, var(--accent) 35%, var(--border)); border-radius: 14px; padding: 8px 10px; background: color-mix(in srgb, var(--card) 38%, transparent); -webkit-backdrop-filter: blur(14px) saturate(1.4); backdrop-filter: blur(14px) saturate(1.4); }

</head>
<body>
<div class="wrap">
  <div class="congrats">
    <span class="cg-ic">🎉</span>
    <div><b id="cgTitle">Congratulations on your growing family!</b><div id="cgSub">Wishing you endless joy as you choose the perfect name for your little one. 💛</div></div>
    <span class="cg-ic">🎊</span>
  </div>

  <div class="panel">
    <div class="seg" id="modeSeg" style="margin-bottom:12px">
      <button data-m="blend" class="active"><span class="tl">🔀 Make Names</span><small>by blending your and your spouse’s names</small></button>
      <button data-m="explore"><span class="tl">✨ Get Names</span><small>get suggestions by giving your choices</small></button>
    </div>
    <div style="margin-bottom:14px">
      <div class="seg" id="genderSeg">
        <button data-g="m">👦 Baby boy</button>
        <button data-g="f">👧 Baby girl</button>
      </div>
    </div>
    <div class="inputs" id="namesRow">
      <div id="wrapA">
        <label class="l" for="nameA">First name</label><input id="nameA" type="text" placeholder="e.g. Rohan" autocomplete="off">
      </div>
      <div class="plus" id="plusSign" title="Blend" aria-hidden="true">
        <svg width="48" height="34" viewBox="0 0 46 34"><circle cx="17" cy="17" r="13" fill="var(--a)" opacity=".8"/><circle cx="29" cy="17" r="13" fill="var(--b)" opacity=".8"/><path d="M23 5.5A13 13 0 0 1 23 28.5A13 13 0 0 1 23 5.5z" fill="var(--m)"/></svg>
      </div>
      <div id="wrapB">
        <label class="l" for="nameB">Second name</label><input id="nameB" type="text" placeholder="e.g. Anika" autocomplete="off">
      </div>
    </div>
    <div class="inputs2">
      <div id="wrapMid"><label class="l" for="midName">Middle name (optional)</label><input id="midName" type="text" placeholder="e.g. Kumar" autocomplete="off"></div>
      <div><label class="l" for="lastName">Last name (optional)</label><input id="lastName" type="text" placeholder="e.g. Sharma" autocomplete="off"></div>
    </div>
  </div>

  <div class="panel">
    <div style="font-weight:600">Meaning &amp; language</div>
    <div class="fgrid">
        <div class="wide"><label class="l" for="theme">Based on</label><select id="theme"><option value="">None</option></select></div>
        <div class="wide opwrap"><button type="button" class="opchip" id="op1" data-v="or" title="Tap to switch between OR and AND">OR</button></div>
        <div class="wide"><label class="l" for="trait">Trait / personality</label><select id="trait"><option value="">None</option></select></div>
        <div class="wide opwrap"><button type="button" class="opchip" id="op2" data-v="or" title="Tap to switch between OR and AND">OR</button></div>
        <div class="wide"><label class="l" for="mWord">Synonyms of a word</label><input id="mWord" type="text" placeholder="e.g. happy, khush, feliz" autocomplete="off"></div>
        <div class="wide"><label class="l" for="mLang">In language</label><select id="mLang"><option value="all">All languages</option></select></div>
        <div class="wide hint" id="mStatus"></div>
        <div class="wide opwrap"><button type="button" class="opchip" id="op3" data-v="and" title="Tap to switch between OR and AND">AND</button></div>
        <div class="wide"><label class="l" for="rashi">Rashi (moon sign)</label><select id="rashi"><option value="">None</option></select></div>
        <div class="wide hint" id="rashiInfo"></div>
    </div>
  </div>

  <div class="panel">
    <details class="filters" open>
      <summary>Filters &amp; options</summary>
      <div class="fgrid">
        <div><label class="l" for="startsWith">Starts with</label><input id="startsWith" type="text" placeholder="e.g. R" autocomplete="off"></div>
        <div><label class="l" for="endsWith">Ends with</label><input id="endsWith" type="text" placeholder="e.g. an" autocomplete="off"></div>
        <div>
          <label class="l" for="rhyme">Rhymes with</label><input id="rhyme" type="text" placeholder="e.g. Aarav" autocomplete="off">
        </div>
        <div class="exonly"><label class="l" for="exKind">Show</label><select id="exKind"><option value="all">All ideas</option><option value="curated">Real names &amp; words</option><option value="invented">Newly invented</option></select></div>
        <div class="wide row" style="margin-top:0">
          <label class="chk"><input type="checkbox" id="nice" checked> Easy to pronounce</label>
          <label class="chk"><input type="checkbox" id="nodict"> Avoid dictionary words</label>
          <label class="chk"><input type="checkbox" id="showRashi" checked> Show rashi on names</label>
          <label class="chk"><input type="checkbox" id="showMeaning" checked> Show meaning on names</label>
          <span class="spacer"></span>
          <select id="sort" style="width:auto">
            <option value="short">Fewest letters first</option>
            <option value="long">Most letters first</option>
            <option value="uniq">Most unique first</option>
            <option value="score">Best match first</option>
            <option value="az">A → Z</option>
            <option value="random">Random</option>
          </select>
          <button id="reset">Reset filters</button>
        </div>
      </div>
    </details>
  </div>

  <div class="panel" style="padding:12px 18px">
    <label class="l" for="maxLen" style="margin:0 0 4px">No. of letters in name: up to <b id="maxLenVal" style="color:var(--accent)">any</b></label>
    <input id="maxLen" type="range" min="2" max="15" value="15">
    <label class="chk" style="margin-top:8px"><input type="checkbox" id="uniqOnly"> Unique names only</label>
  </div>

  <div class="viewbar">
    <div class="seg" id="viewSeg">
      <button data-v="all" class="active">All ideas</button>
      <button data-v="fav">★ Shortlist (<span id="favCount">0</span>)</button>
    </div>
    <span class="spacer"></span>
    <select id="favSort" class="favonly" style="width:auto" title="Sort the shortlist">
      <option value="added">Order added</option>
      <option value="short">Fewest letters first</option>
      <option value="long">Most letters first</option>
      <option value="uniq">Most unique first</option>
      <option value="az">A → Z</option>
    </select>
  </div>
  <div id="out"></div>
</div>
<div class="modal" id="modal" hidden>
  <div class="mbox">
    <div class="mhead">
      <div><div class="mname" id="mName"></div><div class="msub" id="mSub"></div></div>
      <span class="spacer"></span>
      <select id="voice" title="Voice accent for “Hear it”">
        <option value="en-GB">Voice: English (UK)</option>
        <option value="en-US">Voice: English (US)</option>
        <option value="en-IN">Voice: English (India)</option>
        <option value="hi-IN">Voice: Hindi</option>
      </select>
      <button id="mCopy">Copy name</button>
      <button id="mClose">✕ Close</button>
    </div>
    <div class="mgrid" id="mGrid"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>

/* online English synonym / antonym lookup (Datamuse) for words not in the built-in list */
const ONLINE = new Map(), PENDING = new Set();
function fetchOnline(k) {
  if (PENDING.has(k) || ONLINE.has(k)) return;
  PENDING.add(k);
  const get = rel => fetch("https://api.datamuse.com/words?rel_" + rel + "=" + encodeURIComponent(k) + "&max=15").then(r => r.json());
  Promise.all([get("syn"), get("ant")]).then(([s, a]) => {
    const f = arr => arr.map(x => x.word).filter(w => /^[a-z]+$/i.test(w)).map(w => w.toLowerCase());
    ONLINE.set(k, { syn: f(s), ant: f(a) });
  }).catch(() => ONLINE.set(k, { fail: true })).finally(() => { PENDING.delete(k); update(); });
}

function resolveMeaning(ctx) {
  const res = { items: [], msg: "" };
  const ant = ctx.mmode === "ant";
  const src = new Set();
  const extra = [];
  if (ctx.trait) src.add(ctx.trait);
  if (ctx.mword) {
    const k = clean(ctx.mword);
    if (k.length >= 2) {
      const hit = WORD_INDEX.get(k);
      if (hit) hit.forEach(id => src.add(id));
      else {
        const on = ONLINE.get(k);
        if (!on) { fetchOnline(k); res.msg = "Looking up “" + ctx.mword + "” online…"; }
        else if (on.fail) res.msg = "“" + ctx.mword + "” isn't in the built-in word list and the online lookup isn't available right now. Pick a Trait above, or add words in “Your own words”.";
        else {
          on.syn.concat([k]).forEach(w => (WORD_INDEX.get(w) || []).forEach(id => src.add(id)));
          (ant ? on.ant : on.syn).forEach(w => extra.push(w));
          if (!src.size && !extra.length) res.msg = "No " + (ant ? "antonyms" : "synonyms") + " found for “" + ctx.mword + "”.";
        }
      }
    }
  }
  const langs = ctx.mlang === "all" ? LKEYS : [ctx.mlang];
  const seen = new Set(); const noOpp = []; const skippedNeg = [];

function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const ONSETS = "b d g h j k l m n p r s t v y z sh ch kr dh bh th pr tr sw fl br gr".split(" ");
const VOW = "a a a e i i o u aa ai ee ia".split(" ");
const MIDC = ["", "n", "r", "l", "m", "sh", "v", "k", "t"];
const END_F = "a i ya ika ani aya ira ela ina isha ee ita".split(" ");
const END_M = "an av esh ik it ansh ay ir ar o dev raj eet in ul".split(" ");
const END_U = "a i y en an o ay ir ia el".split(" ");
const ENDINGS = "a i an ya esh av in ik ika aya ani isha ansh ay ir it o ee na ra la sh".split(" ");

function invent(ctx, count) {
  const rnd = mulberry(Math.floor(hash("inv" + seed + ctx.gender + ctx.rashi.join("") + ctx.start) * 4294967295));
  const pick = arr => arr[Math.floor(rnd() * arr.length)];
  const ends = ctx.gender === "f" ? END_F : ctx.gender === "m" ? END_M : END_U;
  const tail = ctx.rhyme ? ctx.rhyme.slice(-Math.min(3, ctx.rhyme.length)) : "";
  const out = new Map();
  for (let i = 0; i < count; i++) {
    let start = ctx.rashi.length ? pick(ctx.rashi) : ctx.start ? ctx.start : pick(ONSETS) + pick(VOW);
    if (!/[aeiouy]/.test(start)) start += pick(VOW);
    let body = start;
    if (rnd() < 0.6) body += pick(MIDC) + pick(VOW);
    if (ctx.has.length && rnd() < 0.6) body += pick(ctx.has);
    const end = tail && rnd() < 0.5 ? tail : pick(ends);
    if (isV(body.slice(-1)) && isV(end[0])) body += pick(["r", "n", "l", "m", "v", "k", "t", "s", "d"]);

}

function explorePool(ctx) {

  let items = [];

  if (!items.length && !(ctx.theme || ctx.trait || ctx.mword)) Object.values(THEMES).forEach(t => { items = items.concat(t.items); });
  items.forEach(([w, g, mean]) => { const n = clean(w); put(n, [[n, "t"]], { g, kind: "curated", meaning: mean }); });

function wrapText(cx, text, maxW) {

  text.split(/\s+/).forEach(w => { const t = cur ? cur + " " + w : w; if (cx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; });
  if (cur) lines.push(cur); return lines;
}
function buildShareImage(card) {

    const W = 1080, PAD = 48, IN = W - PAD * 2, SH = Math.round(IN * 0.6);
    const txt = sel => { const e = card.querySelector(sel); return e ? e.textContent.replace(/\s+/g, " ").trim() : ""; };
    const parts = [...card.querySelectorAll(".nm span")].map(sp => ({ t: sp.textContent, c: COL[[...sp.classList].find(c => COL[c])] || "#1f1f2e" }));
    const rows = [];
    const add = (t, size, color, weight, gap) => { if (t) rows.push({ t, size, color, weight: weight || 400, gap: gap || 14 }); };
    add(txt(".full"), 38, "#1f1f2e", 600, 20);
    add(txt(".nick"), 34, "#6b6b7b");
    add(txt(".rashi"), 34, "#8b5cf6");
    card.querySelectorAll(".meta").forEach(m => add(m.textContent.replace(/\s+/g, " ").trim(), 32, "#6b6b7b"));
    add(txt(".via"), 36, "#1f1f2e", 500, 18);
    add(txt(".warn"), 32, "#d9730d");
    const svg = card.querySelector(".thumb svg"), img = new Image();
    img.onload = () => {
      const m = document.createElement("canvas").getContext("2d");
      let h = 16 + 36 + SH + 56;
      let nameSize = 96; m.font = "800 " + nameSize + "px " + FONT;
      const nameW = () => parts.reduce((a, p) => a + m.measureText(p.t).width, 0);
      while (nameW() > IN && nameSize > 40) { nameSize -= 4; m.font = "800 " + nameSize + "px " + FONT; }
      h += nameSize + 18;
      rows.forEach(r => { m.font = r.weight + " " + r.size + "px " + FONT; r.lines = wrapText(m, r.t, IN); h += r.lines.length * Math.round(r.size * 1.35) + r.gap; });
      h += 36 + 84;

      const c = cv.getContext("2d");
      c.fillStyle = "#ffffff"; c.fillRect(0, 0, W, h);
      const g = c.createLinearGradient(0, 0, W, 0); g.addColorStop(0, COL.pa); g.addColorStop(.5, COL.pm); g.addColorStop(1, COL.pb);
      c.fillStyle = g; c.fillRect(0, 0, W, 16);
      const rr = (x, y, w, hh, r) => { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + hh, r); c.arcTo(x + w, y + hh, x, y + hh, r); c.arcTo(x, y + hh, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); };
      const sy = 16 + 36;
      c.save(); rr(PAD, sy, IN, SH, 28); c.clip(); c.drawImage(img, PAD, sy, IN, SH); c.restore();
      rr(PAD, sy, IN, SH, 28); c.lineWidth = 2; c.strokeStyle = "#e3dff0"; c.stroke();
      let y = sy + SH + 56 + nameSize * 0.82, x = PAD;
      c.textBaseline = "alphabetic"; c.font = "800 " + nameSize + "px " + FONT;
      parts.forEach(p => { c.fillStyle = p.c; c.fillText(p.t, x, y); x += c.measureText(p.t).width; });
      y += 18 + nameSize * 0.18;
      rows.forEach(r => {
        c.font = r.weight + " " + r.size + "px " + FONT; c.fillStyle = r.color;
        const lh = Math.round(r.size * 1.35);
        r.lines.forEach(l => { y += lh * 0.8; c.fillText(l, PAD, y); y += lh * 0.2; });
        y += r.gap;
      });
      y += 36;
      c.fillStyle = "#e3dff0"; c.fillRect(PAD, y, IN, 2);
      c.font = "600 32px " + FONT; c.fillStyle = "#6b6b7b"; c.textAlign = "center";
      c.fillText("💛 Found on babynames.website", W / 2, y + 58);
      cv.toBlob(b => b ? resolve(b) : reject(new Error("no blob")), "image/png");
    };
    img.onerror = () => reject(new Error("scene failed"));
    let src = svg ? svg.outerHTML : "";
    if (!src) return reject(new Error("no scene"));
    if (!/xmlns=/.test(src)) src = src.replace("<svg ", '<svg xmlns="http://www.w3.org/2000/svg" ');
    src = src.replace("<svg ", '<svg width="800" height="480" ');
    img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(src);
  });
}

  let how = "";

    if (file && navigator.canShare && navigator.canShare({ files: [file] })) { how = "image"; await navigator.share({ files: [file], title: "Baby name idea: " + name, text }); log(how, "shared"); return; }
    if (navigator.share && !file) { how = "text"; await navigator.share({ title: "Baby name idea: " + name, text }); log(how, "shared"); return; }
  } catch (err) { if (err && err.name === "AbortError") { log(how, "cancelled"); return; } }
  /* no file sharing here (e.g. most desktop browsers): save the picture and copy the text */
  if (file) {
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = file.name;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    copy(text); showToast("Picture saved · text copied"); log("download", "saved");
  } else { copy(text); log("copy", "copied"); }
}

let curName = "", SAY = [];
function openPreview(name) {
  curName = name;
  const ctx = readCtx(), list = scenes(name, ctx);
  SAY = list.map(s => s.say);
  $("mName").textContent = cap(name);
  $("mSub").textContent = (ctx.last || ctx.mid) ? fullName(name, ctx) : "Add a last name above to see full-name previews";
  $("mGrid").innerHTML = list.map((s, i) => `<div class="scene">${s.svg}<div class="cap"><span>${s.title}</span><button data-say="${i}">🔊 Hear it</button></div></div>`).join("");
  $("modal").hidden = false; $("modal").scrollTop = 0; document.body.style.overflow = "hidden";
}
function closePreview() {
  $("modal").hidden = true; document.body.style.overflow = "";
  try { speechSynthesis.cancel(); } catch (e) {}
}
function showToast(t) { const el = $("toast"); el.textContent = t; el.classList.add("show"); setTimeout(() => el.classList.remove("show"), 1600); }
function speak(text) {
  if (!("speechSynthesis" in window)) { showToast("Voice isn't supported in this browser"); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text); u.lang = $("voice").value; u.rate = 0.9;
  speechSynthesis.speak(u);
}
$("mClose").onclick = closePreview;
$("mCopy").onclick = () => copy(fullName(curName, readCtx()));
$("modal").addEventListener("click", e => { if (e.target === $("modal")) closePreview(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("modal").hidden) closePreview(); });

function update() { shown = 24; shownT = 24; render(); }

let suppressClick = false, drag = null;
document.addEventListener("click", e => {
  if (suppressClick) return;
  const xb = e.target.closest("[data-x]");
  if (xb) { removeCard(xb.dataset.x); return; }
  const cyc = e.target.closest("[data-cycle]");
  if (cyc) { scenePick[cyc.dataset.cycle] = (scenePick[cyc.dataset.cycle] || 0) + 1; render(); return; }
  const shr = e.target.closest("[data-share]");
  if (shr) { shareName(shr); return; }
  const star = e.target.closest("[data-f]");
  if (star) { const n = star.dataset.f; favs = favs.includes(n) ? favs.filter(x => x !== n) : [...favs, n]; saveFavs(); render(); return; }
  const use = e.target.closest("[data-use]");
  if (use) { $("nameB").value = use.dataset.use; if (!$("nameA").value) $("nameA").focus(); update(); return; }
  const pv = e.target.closest("[data-pv]");
  if (pv) { openPreview(pv.dataset.pv); return; }
  const say = e.target.closest("[data-say]");
  if (say) { speak(SAY[+say.dataset.say]); return; }
  const nm = e.target.closest(".chip .nm");
  if (nm) copy(cap(nm.closest(".chip").dataset.n));
});

/* swipe a card sideways to dismiss it (or remove it from the shortlist) */
document.addEventListener("pointerdown", e => {
  const c = e.target.closest(".chip");
  if (!c || e.target.closest("button")) return;
  drag = { c, x: e.clientX, y: e.clientY, dx: 0, moved: false, id: e.pointerId };
});
document.addEventListener("pointermove", e => {
  if (!drag || e.pointerId !== drag.id) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.moved && Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy)) { drag.moved = true; try { drag.c.setPointerCapture(e.pointerId); } catch (_) {} }
  if (drag.moved) {
    drag.dx = dx;
    drag.c.style.transition = "none";
    drag.c.style.transform = `translateX(${dx}px) rotate(${dx / 40}deg)`;
    drag.c.style.opacity = String(1 - Math.min(0.7, Math.abs(dx) / 300));
  }
});
function endDrag() {
  if (!drag) return;
  const d = drag; drag = null;
  if (!d.moved) return;
  suppressClick = true; setTimeout(() => { suppressClick = false; }, 0);
  if (Math.abs(d.dx) > 90) {
    d.c.style.transition = "transform .18s, opacity .18s";
    d.c.style.transform = `translateX(${d.dx > 0 ? 600 : -600}px)`; d.c.style.opacity = "0";
    setTimeout(() => removeCard(d.c.dataset.n), 170);
  } else {
    d.c.style.transition = "transform .15s, opacity .15s"; d.c.style.transform = ""; d.c.style.opacity = "";
  }
}
document.addEventListener("pointerup", endDrag);
document.addEventListener("pointercancel", endDrag);

/* ---- anonymous usage events (Google Analytics). No typed names are ever sent. ---- */
(function () {
  const track = (ev, p) => { try { if (typeof gtag === "function") gtag("event", ev, p || {}); } catch (_) {} };
  const seen = new Set();
  window.nmTrack = track;
  const once = (k, ev, p) => { if (seen.has(k)) return; seen.add(k); track(ev, p); };
  const mode = () => document.body.classList.contains("explore") ? "suggest" : "make";
  const gender = () => { const a = document.querySelector("#genderSeg button.active"); return a ? a.dataset.g : "any"; };
  const val = id => { const e = document.getElementById(id); return e ? e.value : ""; };

  /* debounced "searched" event: fires ~2s after the person stops changing inputs */
  let dirty = false, timer = null;
  const markDirty = () => {
    dirty = true; clearTimeout(timer);
    timer = setTimeout(() => {
      if (!dirty) return; dirty = false;
      const out = document.getElementById("out");
      track("names_generated", {
        mode: mode(), gender: gender(),
        results: out ? out.querySelectorAll(".chip").length : 0,
        no_results: out && out.querySelector(".empty") ? 1 : 0,
        with_meaning: (val("theme") || val("trait") || val("mWord")) ? 1 : 0,
        with_rashi: val("rashi") ? 1 : 0,
        unique_only: document.getElementById("uniqOnly") && document.getElementById("uniqOnly").checked ? 1 : 0
      });
    }, 2000);
  };

  /* first real interaction */
  ["click", "input", "keydown", "touchstart"].forEach(t =>
    document.addEventListener(t, () => once("first", "first_interaction", { mode: mode() }), { capture: true, passive: true }));

  /* inputs / selects: one event per control per visit, plus the debounced search event */
  const SKIP = new Set(["nameA", "nameB", "midName", "lastName"]);
  document.addEventListener("change", e => {
    const el = e.target.closest && e.target.closest("input, select"); if (!el || !el.id) return;
    markDirty();
    if (SKIP.has(el.id)) { once("n:" + el.id, "names_entered", { field: el.id }); return; }
    const isSel = el.tagName === "SELECT", p = { filter: el.id };
    if (isSel && el.value) p.value = String(el.value).slice(0, 40);
    once("f:" + el.id, "filter_used", p);
  }, true);
  document.addEventListener("input", e => {
    const el = e.target.closest && e.target.closest("input, select"); if (el && el.id) markDirty();
  }, true);

  /* clicks (capture phase so we see state before the page's own handler changes it) */
  document.addEventListener("click", e => {
    const t = e.target; if (!t.closest) return;
    let m;
    if ((m = t.closest("#modeSeg button"))) { track("mode_switch", { mode: m.dataset.m === "explore" ? "suggest" : "make" }); markDirty(); return; }
    if ((m = t.closest("#genderSeg button"))) { track("gender_select", { gender: m.classList.contains("active") ? "any" : m.dataset.g }); markDirty(); return; }
    if ((m = t.closest("#viewSeg button"))) { track("view_switch", { view: m.dataset.v }); return; }
    if ((m = t.closest("[data-f]"))) { track(favs.includes(m.dataset.f) ? "shortlist_remove" : "shortlist_add", { mode: mode(), name_length: m.dataset.f.length }); return; }
    if (t.closest("[data-x]")) { track("card_dismiss", { mode: mode() }); return; }
    if (t.closest("[data-pv]")) { track("preview_open", { mode: mode() }); return; }
    if (t.closest("[data-say]")) { track("name_pronounce"); return; }
    if (t.closest(".chip .nm")) { track("name_copy", { source: "card" }); return; }
    if (t.closest("#mCopy")) { track("name_copy", { source: "preview" }); return; }
    if (t.closest("#copyFavs")) { track("shortlist_copy", { count: favs.length }); return; }
    if (t.closest("#clearFavs")) { track("shortlist_clear"); return; }
    if (t.closest("#more, #moreT")) { track("show_more"); return; }
    if (t.closest("[data-use]")) { track("browse_word_used"); markDirty(); return; }
    if (t.closest("#reset")) { track("filters_reset"); markDirty(); return; }
    if (t.closest(".opchip")) { track("and_or_toggle", { chip: t.closest(".opchip").id }); markDirty(); return; }
  }, true);

  /* time on page: counts only while the tab is visible, sent when the visitor leaves or switches away */
  let visSince = document.hidden ? 0 : Date.now(), visMs = 0, sentMs = 0, engaged = false;
  const flush = () => {
    if (visSince) { visMs += Date.now() - visSince; visSince = 0; }
    const add = Math.round((visMs - sentMs) / 1000);
    if (add >= 1) { sentMs = visMs; try { gtag("event", "page_time", { seconds: add, transport_type: "beacon" }); } catch (_) {} }
  };
  document.addEventListener("visibilitychange", () => { if (document.hidden) flush(); else visSince = Date.now(); });
  window.addEventListener("pagehide", flush);
  setInterval(() => {
    const cur = visMs + (visSince ? Date.now() - visSince : 0);
    if (!engaged && cur >= 15000) { engaged = true; track("engaged_15s"); }
  }, 3000);
})();
